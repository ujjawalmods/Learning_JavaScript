function addLanguage(lang)
{
    const li = document.createElement('li');
    li.innerHTML = `${lang}`;
    document.querySelector('ul').appendChild(li);
}

addLanguage("C++");

// Optimisied Version of the above function

function addLnaguageOptimised(lang)
{
    const li = document.createElement('li');
    const TextNode = document.createTextNode(lang);
    li.appendChild(TextNode);
    document.querySelector('ul').appendChild(li);
}

addLnaguageOptimised("C#");

// like innerhtml one this doesnt go till end for every creation of element it just creates a text node and appends it to the li and then appends the li to the ul. So this is more optimised than the previous one.

// Edit an element

const secondlang = document.querySelector("li:nth-child(2)"); // nth-child is a css selector which selects the nth child of the parent element. In this case it selects the second li element of the ul.
// secondlang.innerHTML = "AI"; // changing the innerHTML of the second li element BUT NO OPTIMISED
const newli = document.createElement('li'); // creating a new li element
newli.textContent = "AI"; // changing the textContent of the new li element
secondlang.replaceWith(newli); // replacing the second li element with the new li element

</script>
